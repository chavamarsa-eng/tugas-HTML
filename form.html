<!DOCTYPE html>
<html>
    <body>
        <head>
            <title>form</title> <!--judul dalam web (https)-->
        </head>
        <h1>FORM</h1>
        <form>
            <table
            <tr>
                <td><label>Nama Lengkap</label></td>
                <td>:</td>
                <td><input type="text" required placeholder="Masukkan Nama Lengkap"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td>:</td>
                <td><input type="email" required placeholder="Masukkan Email"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td>:</td>
                <td><input type="password" required placeholder="Masukkan Password"></td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td>:</td>
                <td><textarea placeholder="Masukkan Alamat"></textarea></td>
            </tr>
            <tr>
                <td>Tanggal Lahir</td>
                <td>:</td>
                <td><input type="date" required></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>:</td>
                <td><input type="radio" name="jenis kelamin">Laki laki
                    <input type="radio" name="jenis kelamin">Perempuan</td>
            </tr>
            <tr>
                <td>Mata pelajaran yang disukai</td>
                <td>:</td>
                <td><input type="checkbox" name="matpel">Matematika<br>
                    <input type="checkbox" name="matpel">Bahasa Inggris<br>
                    <input type="checkbox" name="matpel">Bahasa Indonesia<br>
                    <input type="checkbox" name="matpel">Fisika</td>
            </tr>
            <tr>    
                <td>Jurusan</td>
                <td>:</td>
                <td><select>
                    <option value="RPL">RPL</option>
                    <option value="TKJ">TKJ</option>
                    <option value="PG">PG</option>
                </select></td>
            </tr>
            <tr>    
                <td>Upload Foto</td>
                <td>:</td>
                <td><input type="file"></td>    
            </tr>
            <tr>
                <td><button type="submit">Submit</button></td>
                <td></td>
                <td><button type="reset">Reset</button></td>
            </tr>
    
        </table>

        

        </form>
    </body>
</html>
